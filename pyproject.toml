[project]
name = "documind"
version = "0.1.0"
description = "RAG-based PDF Q&A with evaluation dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sameera Fathima", email = "you@example.com" }]
dependencies = [
    "streamlit>=1.40",
    "openai>=1.50",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
